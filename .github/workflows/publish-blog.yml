# Daily blog publisher. Replaces the scheduled task on Maddie's Mac, which
# only ran when the Mac was awake and stalled twice (Oct 1-2, Oct 15-21 2026).
# Runs build/publish_next.py, which publishes any queued post whose date has
# arrived, reruns the site passes, commits and pushes. Vercel deploys the push.
# Nothing due = clean exit, no commit.
name: Publish scheduled blog post

on:
  schedule:
    - cron: "5 14 * * *"   # 9:05 AM Central (CDT), 8:05 AM in winter
  workflow_dispatch: {}     # "Run workflow" button for a manual publish

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Publish due posts
        env:
          TZ: America/Chicago
        run: |
          git config user.name "LIB blog publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 build/publish_next.py
